<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مستقبل البيانات - بايثون</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; background: #f4f6f9; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        pre { background: #222; color: #0f0; text-align: left; padding: 15px; border-radius: 5px; direction: ltr; overflow-x: auto; }
    </style>
</head>
<body>

    <h1>محرك المعالجة الهجين (بايثون + ويب)</h1>
    
    <div class="box">
        <h3>اختر ملف CSV واختبر قوة المعالجة الخلفية:</h3>
        <input type="file" id="csvFile" accept=".csv">
        <br>
        <button onclick="uploadAndProcess()">إرسال للمحرك البصري وبايثون</button>
    </div>

    <h3 style="margin-top: 30px;">الاستجابة البرمجية القادمة من البايثون (JSON):</h3>
    <div style="max-width: 800px; margin: 0 auto;">
        <pre id="output">في انتظار رفع الملف...</pre>
    </div>

    <script>
        async function uploadAndProcess() {
            const fileInput = document.getElementById('csvFile');
            const output = document.getElementById('output');
            
            if (fileInput.files.length === 0) {
                alert('الرجاء اختيار ملف أولاً!');
                return;
            }

            output.innerText = "جاري المعالجة بواسطة سكريبت البايثون المحلي...";

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                // الاتصال المباشر بسيرفر البايثون المحلي على منفذ 5000
                const response = await fetch('http://127.0.0.1:5000/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                output.innerText = JSON.stringify(data, null, 4);
            } catch (error) {
                output.innerText = "خطأ في الاتصال بسيرفر البايثون: " + error.message;
            }
        }
    </script>
</body>
</html>
